name: Wyrix News Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify AdMob configuration
        run: |
          test -n "$ADMOB_APP_ID" || {
            echo "Missing ADMOB_APP_ID repository variable"
            exit 1
          }
          test -n "$ADMOB_BANNER_ID" || {
            echo "Missing ADMOB_BANNER_ID repository variable"
            exit 1
          }

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wyrix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "Missing KEYSTORE_BASE64 secret"
            exit 1
          }

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/wyrix-news-release.jks"

          test -s "$RUNNER_TEMP/wyrix-news-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/wyrix-news-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || {
            echo "Missing KEYSTORE_PASSWORD secret"
            exit 1
          }
          test -n "$KEY_PASSWORD" || {
            echo "Missing KEY_PASSWORD secret"
            exit 1
          }
          test -n "$KEY_ALIAS" || {
            echo "Missing KEY_ALIAS secret"
            exit 1
          }

          gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: wyrix-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: wyrix-news-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
